<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salma</title>

    <link rel="stylesheet" href="style1.2.css">
</head>

<body>

    <div class="doctor">

        <div class="doctor-image">
            <img src="doctor img.jpg" alt="Doctor">
        </div>

    
        <div class="Doc">

            <form>

                <h1>Doctor Appointment Form</h1>

                <hr>

                <br>

                <!-- Appointment Date -->
                <div class="doc">
                    <label>
                        Appointment<br>Date
                    </label>

                    <input type="date">
                </div>

                <br>

                <!-- Appointment Time -->
                <div class="doc">
                    <label>
                        Appointment<br>Time
                    </label>

                    <input type="time">
                </div>

                <br>

                <!-- Name -->
                <div class="doc">
                    <label>Name</label>

                    <div class="name">
                        <input type="text" placeholder="First">
                        <input type="text" placeholder="Last">
                    </div>
                </div>

                <br>

                <!-- Gender -->
                <div class="doc">
                    <label>Gender</label>

                    <div class="Gender">

                        <input type="radio" name="Gender" value="male">
                        Male

                        <input type="radio" name="Gender" value="female">
                        Female

                    </div>
                </div>

                <br>

                <!-- Phone -->
                <div class="doc">
                    <label>Phone</label>

                    <input type="tel">
                </div>

                <br>

                <!-- Address -->
                <div class="doc">
                    <label>Address</label>

                    <div class="name-inputs">
                        <input type="text" placeholder="city">
                        <input type="text" placeholder="state">
                    </div>
                </div>

                <br>

                <!-- Your Query -->
                <div class="doc">
                    <label>Your Query</label>

                    <textarea></textarea>
                </div>

                <br>

                <!-- Appointment Type -->
                <div class="doc">

                    <label>
                        Appointment<br>Type
                    </label>

                    <div class="checkboxes">

                        <p>
                            Select which appointment type(s) you require
                        </p>

                        <label>
                            <input type="checkbox" checked>
                            Cervix checkup
                        </label>

                        <label>
                            <input type="checkbox" checked>
                            Heart checkup
                        </label>

                        <label>
                            <input type="checkbox">
                            Eye check-up
                        </label>

                        <label>
                            <input type="checkbox">
                            Hearing Test
                        </label>

                    </div>

                </div>

                <br>

                <!-- Send Button -->
                <button type="submit">Send</button>

            </form>

        </div>

    </div>

</body>

</html>
